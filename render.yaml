services:
  # Option 1: Unified Full-Stack (Runs both FastAPI on 8000 and Streamlit on $PORT)
  - type: web
    name: report-summarization
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: chmod +x start.sh && ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_PROVIDER
        value: mock
      - key: FASTAPI_URL
        value: http://127.0.0.1:8000
